<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f0; color: #1a1a18; min-height: 100vh; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  .app { max-width: 960px; margin: 0 auto; padding: 20px 16px; }
  .page-title { font-size: 26px; font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .page-title-icon { font-size: 28px; }

  .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-title { font-size: 20px; font-weight: 500; min-width: 190px; text-align: center; }
  .nav-btn { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 5px 14px; cursor: pointer; font-size: 18px; color: #444; transition: background 0.15s; }
  .nav-btn:hover { background: #eee; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 7px 16px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; color: #666; font-family: inherit; transition: all 0.15s; }
  .tab.active { background: #e8f5f0; border-color: #1D9E75; color: #1D9E75; font-weight: 500; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: white; border-radius: 12px; padding: 14px 16px; border: 1px solid #ececec; }
  .stat-label { font-size: 11px; color: #999; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-val { font-size: 24px; font-weight: 500; }
  .progress-bar-wrap { height: 5px; background: #eee; border-radius: 3px; margin-top: 8px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #1D9E75, #5DCAA5); border-radius: 3px; transition: width 0.4s ease; }

  .grid-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #e8e8e8; background: white; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td { border-bottom: 1px solid #f2f2f2; }
  .habit-col { width: 155px; min-width: 155px; position: sticky; left: 0; z-index: 2; }
  .head-habit-col { background: #fbfbfa; }
  .body-habit-col-even { background: white; }
  .body-habit-col-odd { background: #fafaf8; }
  .stat-row-habit-col { background: #f8f8f5; }
  .day-th { width: 33px; min-width: 33px; text-align: center; padding: 6px 2px 5px; vertical-align: bottom; }
  .today-th { background: #f0faf6 !important; }
  .day-head { font-size: 9px; color: #bbb; line-height: 1.3; }
  .day-num { font-size: 12px; color: #555; font-weight: 400; }
  .today-num { color: #1D9E75; font-weight: 700; }
  .habit-name-cell { padding: 7px 10px; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 155px; display: flex; align-items: center; gap: 5px; }
  .streak-badge { display: inline-block; font-size: 9px; background: #e8f5f0; color: #0F6E56; padding: 1px 5px; border-radius: 10px; flex-shrink: 0; }
  .day-td { width: 33px; text-align: center; padding: 5px 2px; }
  .today-td { background: rgba(29,158,117,0.05); }
  .week-start { border-left: 2px solid #e5f5ee; }
  .check-box { width: 20px; height: 20px; margin: 0 auto; border-radius: 4px; border: 1.5px solid #d0d0d0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; user-select: none; }
  .check-box.checked { background: #1D9E75; border-color: #1D9E75; }
  .check-box:hover:not(.checked) { border-color: #1D9E75; background: #f0faf6; }
  .check-tick { color: white; font-size: 13px; line-height: 1; }
  .stat-row-label { padding: 5px 10px; font-size: 10px; font-weight: 600; color: #888; }
  .stat-row-cell { font-size: 10px; text-align: center; padding: 4px 2px; }

  .chart-section { background: white; border-radius: 12px; border: 1px solid #ececec; padding: 16px; margin-bottom: 16px; }
  .chart-title { font-size: 12px; color: #999; margin-bottom: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }

  .habits-manage { background: white; border-radius: 12px; border: 1px solid #ececec; padding: 16px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-input { flex: 1; padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; color: #1a1a18; transition: border-color 0.15s; }
  .add-input:focus { border-color: #1D9E75; box-shadow: 0 0 0 3px rgba(29,158,117,0.08); }
  .add-btn { padding: 9px 18px; border-radius: 8px; border: none; background: #1D9E75; color: white; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; transition: background 0.15s; }
  .add-btn:hover { background: #0F6E56; }
  .habit-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #fafaf8; border-radius: 8px; margin-bottom: 7px; border: 1px solid #f0f0f0; }
  .habit-item-left { display: flex; align-items: center; gap: 10px; }
  .habit-idx { font-size: 11px; color: #bbb; min-width: 22px; font-weight: 500; }
  .habit-item-name { font-size: 13.5px; }
  .del-btn { background: none; border: none; cursor: pointer; color: #e24b4a; font-size: 20px; padding: 0 4px; line-height: 1; opacity: 0.7; transition: opacity 0.15s; font-family: inherit; }
  .del-btn:hover { opacity: 1; }
  .empty-state { text-align: center; color: #bbb; padding: 2.5rem; font-size: 14px; }

  .footer { text-align: center; font-size: 11px; color: #bbb; margin-top: 24px; }

  @media (max-width: 540px) {
    .month-title { font-size: 16px; min-width: 150px; }
    .stat-val { font-size: 20px; }
    .stats-grid { gap: 8px; }
    .stat-card { padding: 10px 12px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS_SHORT = ["Su","Mo","Tu","We","Th","Fr","Sa"];

const DEFAULT_HABITS = [
  { id:"h1", name:"Wake up at 05:00" },
  { id:"h2", name:"Gym" },
  { id:"h3", name:"Stop Watching Porn" },
  { id:"h4", name:"Reading / Learning" },
  { id:"h5", name:"Budget Tracking" },
  { id:"h6", name:"Project Work" },
  { id:"h7", name:"No Alcohol" },
  { id:"h8", name:"Social Media Detox" },
  { id:"h9", name:"Goal Journaling" },
  { id:"h10", name:"Cold Shower" }
];

function getDaysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function getDow(y, m, d) { return new Date(y, m, d).getDay(); }

function loadFromStorage(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}

function App() {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());
  const [tab, setTab] = useState("tracker");
  const [habits, setHabits] = useState(() => loadFromStorage("ht_habits", DEFAULT_HABITS));
  const [completions, setCompletions] = useState(() => loadFromStorage("ht_completions", {}));
  const [newHabit, setNewHabit] = useState("");
  const chartRef = useRef(null);
  const chartInst = useRef(null);

  const mkey = `${year}-${month}`;
  const days = getDaysInMonth(year, month);
  const todayDay = today.getFullYear()===year && today.getMonth()===month ? today.getDate() : -1;

  useEffect(() => { try { localStorage.setItem("ht_habits", JSON.stringify(habits)); } catch {} }, [habits]);
  useEffect(() => { try { localStorage.setItem("ht_completions", JSON.stringify(completions)); } catch {} }, [completions]);

  const isChecked = (hid, d) => !!(completions[mkey]?.[hid]?.[d]);

  const toggle = (hid, d) => {
    setCompletions(prev => {
      const m = prev[mkey] || {};
      const h = m[hid] || {};
      return { ...prev, [mkey]: { ...m, [hid]: { ...h, [d]: !h[d] } } };
    });
  };

  const getDayDone = (d) => habits.filter(h => isChecked(h.id, d)).length;
  const getDayPct = (d) => habits.length ? Math.round((getDayDone(d)/habits.length)*100) : 0;

  const totalCompleted = Object.values(completions[mkey]||{})
    .reduce((s,ds) => s + Object.values(ds).filter(Boolean).length, 0);
  const overallPct = habits.length
    ? Math.round((totalCompleted/(habits.length*days))*100) : 0;

  const getStreak = (hid) => {
    let streak = 0;
    const start = todayDay > 0 ? todayDay : days;
    for (let d = start; d >= 1; d--) {
      if (isChecked(hid, d)) streak++; else break;
    }
    return streak;
  };

  // Chart
  useEffect(() => {
    if (tab !== "tracker" || !chartRef.current) return;
    const labels = Array.from({length:days},(_,i)=>i+1);
    const data = labels.map(d => getDayPct(d));
    if (chartInst.current) { chartInst.current.destroy(); chartInst.current = null; }
    chartInst.current = new Chart(chartRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Completion %",
          data,
          borderColor: "#1D9E75",
          backgroundColor: "rgba(29,158,117,0.08)",
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointHoverRadius: 5,
          pointBackgroundColor: "#1D9E75",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => `Day ${items[0].label}`,
              label: (ctx) => ` ${ctx.parsed.y}% complete (${getDayDone(parseInt(ctx.label))}/${habits.length} habits)`
            }
          }
        },
        scales: {
          x: {
            grid: { color: "rgba(0,0,0,0.04)" },
            ticks: { font: { size: 10 }, maxTicksLimit: 16, color: "#999" }
          },
          y: {
            min: 0, max: 100,
            grid: { color: "rgba(0,0,0,0.04)" },
            ticks: { font: { size: 10 }, callback: v => `${v}%`, color: "#999" }
          }
        }
      }
    });
    return () => { if (chartInst.current) { chartInst.current.destroy(); chartInst.current = null; } };
  }, [tab, completions, habits, year, month]);

  const prevMonth = () => month===0 ? (setMonth(11), setYear(y=>y-1)) : setMonth(m=>m-1);
  const nextMonth = () => month===11 ? (setMonth(0), setYear(y=>y+1)) : setMonth(m=>m+1);

  const addHabit = () => {
    if (!newHabit.trim()) return;
    setHabits(prev => [...prev, { id:"h"+Date.now(), name: newHabit.trim() }]);
    setNewHabit("");
  };

  const removeHabit = (id) => {
    if (window.confirm("Remove this habit? Your past data for it will be kept.")) {
      setHabits(prev => prev.filter(h => h.id !== id));
    }
  };

  const pctColor = (pct) => pct >= 80 ? "#1D9E75" : pct >= 50 ? "#BA7517" : "#ccc";
  const isWeekStart = (d) => getDow(year, month, d) === 0 && d > 1;

  const exportCSV = () => {
    const header = ["Habit", ...Array.from({length:days},(_,i)=>`Day ${i+1}`), "Total", "Streak"];
    const rows = habits.map(h => {
      const dayValues = Array.from({length:days},(_,i)=>isChecked(h.id,i+1)?1:0);
      const total = dayValues.reduce((a,b)=>a+b,0);
      return [h.name, ...dayValues, total, getStreak(h.id)];
    });
    const csv = [header, ...rows].map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `habits-${MONTHS[month]}-${year}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="app">
      <h1 className="sr-only">Habit Tracker</h1>
      <div className="page-title">
        <span className="page-title-icon">📋</span>
        Habit Tracker
      </div>

      <div className="header">
        <div className="month-nav">
          <button className="nav-btn" onClick={prevMonth} title="Previous month">‹</button>
          <div className="month-title">{MONTHS[month]} {year}</div>
          <button className="nav-btn" onClick={nextMonth} title="Next month">›</button>
        </div>
        <div className="tabs">
          <button className={`tab${tab==="tracker"?" active":""}`} onClick={()=>setTab("tracker")}>📊 Tracker</button>
          <button className={`tab${tab==="habits"?" active":""}`} onClick={()=>setTab("habits")}>⚙️ Habits</button>
        </div>
      </div>

      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-label">Number of habits</div>
          <div className="stat-val">{habits.length}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Completed this month</div>
          <div className="stat-val">{totalCompleted}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Monthly progress</div>
          <div className="stat-val">{overallPct}%</div>
          <div className="progress-bar-wrap">
            <div className="progress-bar-fill" style={{width:`${overallPct}%`}}></div>
          </div>
        </div>
      </div>

      {tab === "tracker" ? (
        <>
          <div className="grid-wrap">
            <table>
              <thead>
                <tr>
                  <th className="habit-col head-habit-col" style={{padding:"8px 10px",textAlign:"left",fontSize:11,color:"#aaa",fontWeight:600,letterSpacing:"0.4px",textTransform:"uppercase",borderBottom:"2px solid #efefef"}}>Habits</th>
                  {Array.from({length:days},(_,i)=>i+1).map(d=>(
                    <th key={d} className={`day-th${d===todayDay?" today-th":""}${isWeekStart(d)?" week-start":""}`} style={{background:d===todayDay?"#f0faf6":"#fbfbfa",borderBottom:"2px solid #efefef"}}>
                      <div className="day-head">{DAYS_SHORT[getDow(year,month,d)]}</div>
                      <div className={`day-num${d===todayDay?" today-num":""}`}>{d}</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {habits.map((h,hi)=>{
                  const streak = getStreak(h.id);
                  const isEven = hi%2===0;
                  return (
                    <tr key={h.id}>
                      <td className={`habit-col ${isEven?"body-habit-col-even":"body-habit-col-odd"}`}>
                        <div className="habit-name-cell">
                          <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.name}</span>
                          {streak >= 2 && <span className="streak-badge">🔥{streak}</span>}
                        </div>
                      </td>
                      {Array.from({length:days},(_,i)=>i+1).map(d=>{
                        const chk = isChecked(h.id,d);
                        return (
                          <td key={d} className={`day-td${d===todayDay?" today-td":""}${isWeekStart(d)?" week-start":""}`} style={{background:d===todayDay?"rgba(29,158,117,0.05)":isEven?"white":"#fafaf8"}}>
                            <div className={`check-box${chk?" checked":""}`} onClick={()=>toggle(h.id,d)} role="checkbox" aria-checked={chk} aria-label={`${h.name} day ${d}`}>
                              {chk && <span className="check-tick">✓</span>}
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
                <tr style={{borderTop:"2px solid #eee"}}>
                  <td className="habit-col stat-row-label stat-row-habit-col">Progress %</td>
                  {Array.from({length:days},(_,i)=>i+1).map(d=>{
                    const pct=getDayPct(d);
                    return (
                      <td key={d} className={`stat-row-cell${isWeekStart(d)?" week-start":""}`} style={{background:"#f8f8f5",color:pctColor(pct),fontWeight:pct>=80?600:400}}>
                        {getDayDone(d)>0?`${pct}%`:""}
                      </td>
                    );
                  })}
                </tr>
                <tr>
                  <td className="habit-col stat-row-label" style={{background:"#fafaf8"}}>Done</td>
                  {Array.from({length:days},(_,i)=>i+1).map(d=>{
                    const done = getDayDone(d);
                    return (
                      <td key={d} className={`stat-row-cell${isWeekStart(d)?" week-start":""}`} style={{background:"#fafaf8",color:"#1D9E75",fontWeight:done>0?500:400}}>
                        {done||""}
                      </td>
                    );
                  })}
                </tr>
                <tr>
                  <td className="habit-col stat-row-label stat-row-habit-col">Not done</td>
                  {Array.from({length:days},(_,i)=>i+1).map(d=>{
                    const nd = habits.length - getDayDone(d);
                    return (
                      <td key={d} className={`stat-row-cell${isWeekStart(d)?" week-start":""}`} style={{background:"#f8f8f5",color:nd>0?"#e24b4a":"#ccc"}}>
                        {nd>0&&getDayDone(d)>0?nd:nd===habits.length?"":""}
                      </td>
                    );
                  })}
                </tr>
              </tbody>
            </table>
          </div>

          <div className="chart-section">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div className="chart-title">Daily completion — {MONTHS[month]} {year}</div>
              <button onClick={exportCSV} style={{background:"none",border:"1px solid #ddd",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:12,color:"#666",fontFamily:"inherit"}}>⬇ Export CSV</button>
            </div>
            <div style={{position:"relative",height:170}}>
              <canvas ref={chartRef} role="img" aria-label={`Habit completion rate chart for ${MONTHS[month]} ${year}`}></canvas>
            </div>
          </div>
        </>
      ) : (
        <div className="habits-manage">
          <div style={{marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:500,marginBottom:4}}>Your habits ({habits.length})</div>
            <div style={{fontSize:12,color:"#999"}}>Add or remove habits. Your data is saved automatically in your browser.</div>
          </div>
          <div className="add-row">
            <input
              className="add-input"
              value={newHabit}
              onChange={e=>setNewHabit(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&addHabit()}
              placeholder="New habit name (e.g. Meditate, Run 5km, Read 30min)..."
              maxLength={60}
            />
            <button className="add-btn" onClick={addHabit}>+ Add</button>
          </div>
          {habits.length === 0 && (
            <div className="empty-state">No habits yet. Add your first habit above!</div>
          )}
          {habits.map((h,i)=>(
            <div key={h.id} className="habit-item">
              <div className="habit-item-left">
                <span className="habit-idx">#{i+1}</span>
                <span className="habit-item-name">{h.name}</span>
              </div>
              <button className="del-btn" onClick={()=>removeHabit(h.id)} title="Remove habit">×</button>
            </div>
          ))}
          <div style={{marginTop:20,padding:"12px 14px",background:"#f8f8f5",borderRadius:8,fontSize:12,color:"#888",lineHeight:1.6}}>
            💡 <strong>Tips:</strong> Keep habits specific and binary (done/not done).
            Aim for 5–12 habits. Streak badges 🔥 appear when you complete a habit consecutively.
          </div>
        </div>
      )}

      <div className="footer">Habit Tracker — data stored locally in your browser · Built with React &amp; Chart.js</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
